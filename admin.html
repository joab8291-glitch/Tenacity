<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#101a22"><title>Tenacity | Order desk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--ink:#111c24;--deep:#0b141b;--paper:#f5f3ed;--gold:#c7a15f;--muted:#68747a;--line:#dedbd2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}header{background:var(--deep);color:#fff;padding:22px max(22px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header strong{font:800 20px Manrope}.wrap{max-width:1180px;margin:36px auto;padding:0 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 10px 28px #111c2408}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:7px;flex:1;min-width:190px}label{font-weight:700;font-size:12px}input{width:100%;border:1px solid #d5d2c9;border-radius:7px;padding:12px;font:inherit}button{border:0;border-radius:7px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}button.gold{background:var(--gold);color:#17212a}button.ghost{background:#ece9e1;color:var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid #c7a15f88;outline-offset:2px}.muted{color:var(--muted)}.status{font-size:12px;margin-top:10px;min-height:18px}.orders{display:grid;gap:12px}.order{border:1px solid var(--line);border-radius:9px;padding:16px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.order h3{margin:0 0 7px;font:700 17px Manrope}.order p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.5}.order .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.order .actions input{min-width:110px}.pill{display:inline-block;background:#f1eee6;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:760px){.wrap{margin:20px auto}.order{grid-template-columns:1fr}.order .actions{align-items:stretch}.order .actions>*{flex:1}}</style></head><body>
<header><strong>TENACITY / ORDER DESK</strong><span>Private staff workspace</span></header><main class="wrap">
<section class="panel"><h2>Staff access</h2><p class="muted">Enter the order admin token configured in Vercel. It stays in this page's memory and is not placed in the URL.</p><div class="row"><div class="field"><label for="token">Admin token</label><input id="token" type="password" autocomplete="current-password" placeholder="TENACITY_ORDER_ADMIN_TOKEN"></div><button id="load">Load quotations</button><button class="ghost" id="clear">Clear token</button></div><p id="notice" class="status" role="status" aria-live="polite"></p></section>
<section class="panel"><div class="row" style="justify-content:space-between"><div><h2>Quotation requests</h2><p class="muted">Confirm stock and final pricing before approving an order.</p></div><button class="ghost" id="refresh">Refresh list</button></div><div id="orders" class="orders"><div class="empty">Sign in to load orders.</div></div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let token="";const say=t=>$("notice").textContent=t;const headers=()=>({Authorization:"Bearer "+token,"Content-Type":"application/json"});async function apiData(response){const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{}}catch{const hint=raw.trim().slice(0,180);console.error("Admin API returned non-JSON:",response.status,hint);throw new Error(response.ok?"The server returned an unreadable response. Please retry.":"The management API returned a server error ("+response.status+"). Check the Vercel function logs; the response was not JSON.")}if(!response.ok)throw new Error(data.error||("Request failed ("+response.status+")."));return data;}
async function load(){token=$("token").value.trim();if(!token){say("Enter the admin token first.");return}say("Loading orders…");try{const r=await fetch("/api/admin/orders",{headers:headers(),cache:"no-store"}),d=await apiData(r);render(d.orders||[]);say((d.orders||[]).length+" order records loaded.")}catch(e){say(e.message)}}
function render(items){const root=$("orders");if(!items.length){root.innerHTML='<div class="empty">No quotation requests found.</div>';return}root.replaceChildren(...items.map(o=>{const card=document.createElement("article");card.className="order";const info=document.createElement("div"),customer=document.createElement("div"),actions=document.createElement("div"),h=document.createElement("h3"),badge=document.createElement("span"),details=document.createElement("p"),email=document.createElement("p"),list=document.createElement("p"),notes=document.createElement("p"),payment=document.createElement("p");h.textContent=o.orderNumber;badge.className="pill";badge.textContent=String(o.status).replace(/_/g," ");details.textContent=(o.customer?.name||"Customer")+" · "+(o.customer?.phone||"");email.textContent=o.customer?.email||"No email supplied";info.append(h,badge,details,email);list.textContent=(o.items||[]).map(x=>x.name+" × "+x.quantity).join(" · ");notes.textContent=o.notes||"No extra notes";customer.append(list,notes);payment.textContent="Payment: "+(o.payment?.status||"not due")+(o.payment?.receipt?" · Receipt "+o.payment.receipt:"");const amount=document.createElement("input");amount.type="number";amount.min="1";amount.max="250000";amount.step="1";amount.placeholder="Approved total (KES)";amount.setAttribute("aria-label","Approved total in KES");if(o.amount)amount.value=o.amount;const approve=document.createElement("button");approve.className="gold";approve.textContent="Approve & set price";approve.onclick=()=>update(o.orderNumber,"approved",amount.value);const reject=document.createElement("button");reject.className="ghost";reject.textContent="Reject";reject.onclick=()=>update(o.orderNumber,"rejected");const fulfilled=document.createElement("button");fulfilled.className="ghost";fulfilled.textContent="Mark fulfilled";fulfilled.onclick=()=>update(o.orderNumber,"fulfilled");const remove=document.createElement("button");remove.className="ghost";remove.textContent="Delete request";remove.setAttribute("aria-label","Delete quotation request "+o.orderNumber);remove.onclick=()=>removeOrder(o.orderNumber);actions.className="actions";actions.append(amount,approve,reject,fulfilled,remove,payment);card.append(info,customer,actions);return card}))}
async function removeOrder(orderNumber){if(!confirm("Permanently delete quotation request "+orderNumber+"? This cannot be undone."))return;try{const r=await fetch("/api/admin/orders",{method:"DELETE",headers:headers(),body:JSON.stringify({orderNumber})}),d=await apiData(r);say("Quotation request "+orderNumber+" deleted.");await load()}catch(e){say(e.message)}}
async function update(orderNumber,status,amount){if(status==="approved"&&(!Number.isSafeInteger(Number(amount))||Number(amount)<1||Number(amount)>250000)){say("Enter a valid whole-number KES amount.");return}if(!confirm(status==="approved"?"Approve at KSh "+amount+"? The customer can then request an M-Pesa prompt.":"Change "+orderNumber+" to "+status+"?"))return;try{const r=await fetch("/api/admin/orders",{method:"PATCH",headers:headers(),body:JSON.stringify({orderNumber,status,amount:Number(amount)})}),d=await apiData(r);say(orderNumber+" updated.");await load()}catch(e){say(e.message)}}
$("load").onclick=load;$("refresh").onclick=load;$("clear").onclick=()=>{$("token").value="";token="";$("orders").innerHTML='<div class="empty">Token cleared. Sign in to load orders.</div>';say("Access token cleared.")};
})();
</script></body></html>
