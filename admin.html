<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenacity | Order Desk</title><style>body{font:15px system-ui;background:#f4f2ec;color:#14212a;margin:0}.wrap{max-width:1100px;margin:40px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:30px}input,button{font:inherit;padding:12px;border:1px solid #d5d1c7;border-radius:8px}button{background:#172832;color:white;cursor:pointer}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.orders{display:grid;gap:14px;margin-top:24px}.order{background:white;padding:20px;border:1px solid #e3dfd6;border-radius:12px}.muted{color:#68747a}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{font-weight:700;color:#916b2e}.actions{margin-top:14px}.actions input{width:150px}</style></head><body><main class="wrap"><header><div><p class="muted">TENACITY LOCKS · STAFF</p><h1>Quotation & Order Desk</h1></div><div class="toolbar"><input id="token" type="password" placeholder="Admin access token" autocomplete="current-password"><button id="load">Load orders</button></div></header><p class="muted">Approve a quotation with the confirmed total before the customer can pay by M-Pesa.</p><div id="message" role="status"></div><section id="orders" class="orders"></section></main><script>const $=id=>document.getElementById(id);async function request(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value,...opts.headers}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const d=await request('/api/admin/orders');$('orders').innerHTML=d.orders.map(o=>'<article class="order"><div class="row"><strong>'+esc(o.orderNumber)+'</strong><span class="status">'+esc(o.status)+'</span></div><p>'+esc(o.customer.name)+' · '+esc(o.customer.phone)+' · '+esc(o.customer.email||'')+'</p><ul>'+o.items.map(i=>'<li>'+esc(i.name)+' × '+i.quantity+'</li>').join('')+'</ul><p class="muted">'+esc(o.notes||'No extra notes')+'</p><div class="actions"><input type="number" min="1" step="1" placeholder="Total KES" id="amt-'+o.orderNumber+'"><button data-status="approved" data-id="'+o.orderNumber+'">Approve & set total</button><button data-status="rejected" data-id="'+o.orderNumber+'">Reject</button></div></article>').join('')||'<p>No quotation requests yet.</p>';$('message').textContent='Loaded '+d.orders.length+' orders.'}catch(e){$('message').textContent=e.message}}$('load').onclick=load;$('orders').onclick=async e=>{const b=e.target.closest('[data-status]');if(!b)return;try{const body={orderNumber:b.dataset.id,status:b.dataset.status};if(body.status==='approved')body.amount=Number($('amt-'+body.orderNumber).value);await request('/api/admin/orders',{method:'PATCH',body:JSON.stringify(body)});$('message').textContent='Order updated.';load()}catch(err){$('message').textContent=err.message}}</script></body></html>
